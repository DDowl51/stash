[workspace]
resolver = "3"
# 通配符匹配不到目录时 cargo 会报错，所以目录出现一个加一个。
members = ["apps/*", "tests/*", "features/*/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# kernel 和通用系统服务在共享仓库 mk-kit（../mk-kit），这里用 path 依赖。
kernel-api = { path = "../mk-kit/crates/kernel-api" }
boot = { path = "../mk-kit/crates/boot" }
boot-build = { path = "../mk-kit/crates/boot-build" }
testkit = { path = "../mk-kit/crates/testkit" }

cli-contract = { path = "../mk-kit/contracts/cli" }
clock-contract = { path = "../mk-kit/contracts/clock" }
log-contract = { path = "../mk-kit/contracts/log" }
prompt-contract = { path = "../mk-kit/contracts/prompt" }
sql-contract = { path = "../mk-kit/contracts/sql" }
window-contract = { path = "../mk-kit/contracts/window" }

items-contracts = { path = "features/items/contracts" }
items-core = { path = "features/items/core" }
items = { path = "features/items/component" }
capture-contracts = { path = "features/capture/contracts" }
capture-core = { path = "features/capture/core" }
capture = { path = "features/capture/component" }
context-window = { path = "features/context-window/component" }

cli-clap = { path = "../mk-kit/services/cli-clap" }
clock-system = { path = "../mk-kit/services/clock-system" }
log-stderr = { path = "../mk-kit/services/log-stderr" }
prompt-vicinae = { path = "../mk-kit/services/prompt-vicinae" }
storage-sqlite = { path = "../mk-kit/services/storage-sqlite" }
wm-niri = { path = "../mk-kit/services/wm-niri" }

getrandom = "0.3"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
ulid = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.dev.package."*"]
opt-level = 2
