[workspace]
resolver = "3"
# 通配符匹配不到目录时 cargo 会报错，所以目录出现一个加一个。
members = ["apps/*", "tests/*", "features/*/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# kernel 和通用系统服务在共享仓库 mk-kit（../mk-kit），这里用 path 依赖。
kernel-api = { path = "../mk-kit/crates/kernel-api" }
boot = { path = "../mk-kit/crates/boot" }
boot-build = { path = "../mk-kit/crates/boot-build" }
testkit = { path = "../mk-kit/crates/testkit" }

browser-contract = { path = "../mk-kit/contracts/browser" }
cli-contract = { path = "../mk-kit/contracts/cli" }
clock-contract = { path = "../mk-kit/contracts/clock" }
exec-contract = { path = "../mk-kit/contracts/exec" }
log-contract = { path = "../mk-kit/contracts/log" }
notify-contract = { path = "../mk-kit/contracts/notify" }
process-contract = { path = "../mk-kit/contracts/process" }
prompt-contract = { path = "../mk-kit/contracts/prompt" }
screenshot-contract = { path = "../mk-kit/contracts/screenshot" }
sql-contract = { path = "../mk-kit/contracts/sql" }
tui-contract = { path = "../mk-kit/contracts/tui" }
vcs-contract = { path = "../mk-kit/contracts/vcs" }
window-contract = { path = "../mk-kit/contracts/window" }

items-contracts = { path = "features/items/contracts" }
items-core = { path = "features/items/core" }
items = { path = "features/items/component" }
capture-contracts = { path = "features/capture/contracts" }
capture-core = { path = "features/capture/core" }
capture = { path = "features/capture/component" }
context-window = { path = "features/context-window/component" }
context-terminal-core = { path = "features/context-terminal/core" }
context-terminal = { path = "features/context-terminal/component" }
context-browser-core = { path = "features/context-browser/core" }
context-browser = { path = "features/context-browser/component" }
context-screenshot = { path = "features/context-screenshot/component" }
context-script-core = { path = "features/context-script/core" }
context-script = { path = "features/context-script/component" }
expand-calc-core = { path = "features/expand-calc/core" }
expand-calc = { path = "features/expand-calc/component" }
expand-snippets = { path = "features/expand-snippets/component" }
expand-script-core = { path = "features/expand-script/core" }
expand-script = { path = "features/expand-script/component" }
review-core = { path = "features/review/core" }
review = { path = "features/review/component" }
remind-core = { path = "features/remind/core" }
remind = { path = "features/remind/component" }

browser-chromium = { path = "../mk-kit/services/browser-chromium" }
browser-firefox = { path = "../mk-kit/services/browser-firefox" }
browser-history = { path = "../mk-kit/services/browser-history" }
browser-qutebrowser = { path = "../mk-kit/services/browser-qutebrowser" }
cli-clap = { path = "../mk-kit/services/cli-clap" }
clock-system = { path = "../mk-kit/services/clock-system" }
exec-tokio = { path = "../mk-kit/services/exec-tokio" }
log-stderr = { path = "../mk-kit/services/log-stderr" }
notify-dbus = { path = "../mk-kit/services/notify-dbus" }
process-procfs = { path = "../mk-kit/services/process-procfs" }
prompt-vicinae = { path = "../mk-kit/services/prompt-vicinae" }
screenshot-niri = { path = "../mk-kit/services/screenshot-niri" }
storage-sqlite = { path = "../mk-kit/services/storage-sqlite" }
tui-ratatui = { path = "../mk-kit/services/tui-ratatui" }
vcs-git = { path = "../mk-kit/services/vcs-git" }
wm-niri = { path = "../mk-kit/services/wm-niri" }

getrandom = "0.3"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
ulid = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.dev.package."*"]
opt-level = 2
